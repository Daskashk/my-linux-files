
volume=100
volume-max=200
save-position-on-quit=yes
framedrop=no
cache=yes
cache-secs=300
demuxer-max-bytes=10485760
demuxer-max-back-bytes=10485760
force-seekable=yes

hwdec-codecs=h264,h265,vp9,av1
gpu-hwdec-interop=auto
profile=gpu-hq
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
tscale=oversample

video-sync=audio
correct-pts=yes

interpolation=yes

deband=yes
deband-iterations=4
deband-threshold=45
deband-range=16

sub-font="Ubuntu Nerd Font"
sub-scale-with-window=yes
sub-codepage=latin1

osc=no
osd-bar=no

af=lavfi="equalizer=f=100:width_type=h:width=250:g=3,equalizer=f=2500:width_type=h:width=500:g=7,equalizer=f=10000:width_type=h:width=500:g=2"
