# Configuración optimizada para conexiones lentas e inestables
# Basado en: https://aria2.github.io/manual/en/html/aria2c.html

# Conexiones máximas
max-connection-per-server=5
split=5
min-split-size=1M

# Tiempo de espera y retries
timeout=60
retry-wait=30
max-tries=10

# Continuar descargas incompletas
continue=true

# Verificar hash al completar
check-integrity=true

# Servidores HTTP/FTP
max-concurrent-downloads=8

# Servidores BitTorrent
bt-max-peers=55
bt-stop-timeout=30

# Deshabilitar IPv6 si causa problemas
disable-ipv6=true

# Usar DNS alternativo si hay problemas de resolución
#dns-servers=8.8.8.8,1.1.1.1

# Buffer para conexiones lentas
socket-recv-buffer-size=4M


# --- Configuración de proxy (descomentar si es necesario) ---
#http-proxy=http://proxy.example.com:8080
#https-proxy=http://proxy.example.com:8080
#ftp-proxy=http://proxy.example.com:8080

# --- Configuración de servidores específicos ---
#server-stat-of=/home/nab/.aria2/server_stats.txt

# Asignación de archivo (falloc es el más rápido para sistemas de archivos modernos como ext4/xfs)
file-allocation=falloc

# Nivel de log en consola (para que no llene la terminal de texto, ya que tu función lo tenía en 'error')
console-log-level=error
